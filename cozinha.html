<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Cozinha</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        body { background:#F8F9FA; padding:16px; }
        h1 { text-align:center; color:#212529; margin-bottom:20px; padding-bottom:10px; border-bottom:2px solid #212529; }
        .pedido { background:#FFF; border-radius:12px; padding:16px; margin-bottom:16px; border:1px solid #CED4DA; }
        .mesa { font-weight:bold; font-size:18px; color:#212529; margin-bottom:10px; }
        .prato { margin-bottom:10px; }
        .nome-prato { font-weight:bold; color:#495057; margin-bottom:4px; }
        .porcoes { margin-top:12px; padding-top:10px; border-top:2px dashed #DEE2E6; }
        .titulo-porcoes { font-weight:bold; color:#495057; margin-bottom:6px; font-size:15px; }
        .item { padding:2px 0 2px 15px; color:#212529; }
        .btn-pronto { padding:8px 16px; background:#212529; color:white; border:none; border-radius:6px; cursor:pointer; margin-top:10px; font-weight:bold; }
        .aviso { text-align:center; color:#6C757D; margin-bottom:16px; font-size:14px; }
    </style>
</head>
<body>
    <h1>📋 PEDIDOS DA COZINHA</h1>
    <div class="aviso">Atualiza automaticamente a cada 2 segundos</div>
    <div id="lista"></div>

    <script>
        // COLOQUE O MESMO LINK AQUI TAMBÉM
        const LINK_GIST = "https://gist.githubusercontent.com/marcs600/15c45bc9cfad612bf01307b69d5ba465/raw/8950b0e30e76a9502b823c21b6f6eaa6d2fa8e54/dados-comanda.json";

        async function atualizar() {
            try {
                const res = await fetch(LINK_GIST);
                if(!res.ok) return;
                const dados = await res.json();
                const lista = document.getElementById('lista');
                lista.innerHTML = '';

                dados.forEach(comanda => {
                    if(comanda.pratos.length === 0 && comanda.porcoes.length === 0) return;

                    lista.innerHTML += `<div class="pedido"><div class="mesa">🪑 Mesa ${comanda.id}</div>`;
                    
                    comanda.pratos.forEach(prato => {
                        lista.innerHTML += `<div class="prato"><div class="nome-prato">Prato ${prato.numero}</div>`;
                        prato.itens.forEach(item => lista.innerHTML += `<div class="item">• ${item.nome}</div>`);
                        lista.innerHTML += `</div>`;
                    });

                    if(comanda.porcoes.length > 0){
                        lista.innerHTML += `<div class="porcoes"><div class="titulo-porcoes">🍽️ PORÇÕES</div>`;
                        comanda.porcoes.forEach(item => lista.innerHTML += `<div class="item">• ${item.nome}</div>`);
                        lista.innerHTML += `</div>`;
                    }

                    lista.innerHTML += `<button class="btn-pronto" onclick="limparMesa(${comanda.id})">✅ Pedido Pronto</button></div>`;
                });
            } catch(e) {}
        }

        async function limparMesa(id){
            try {
                const res = await fetch(LINK_GIST);
                if(!res.ok) return;
                let d = await res.json();
                const i = d.findIndex(c=>c.id===id);
                if(i!==-1){ 
                    d[i].pratos = []; 
                    d[i].porcoes = [];
                    await fetch(LINK_GIST, {
                        method: "PUT",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(d)
                    });
                    atualizar();
                }
            } catch(e) {}
        }

        setInterval(atualizar, 2000);
        atualizar();
    </script>
</body>
</html>
